name: Release

on:
  push:
    branches: [master]
    paths: [VERSION]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    container: archlinux:latest

    permissions:
      contents: write

    env:
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm qt6-base qt6-declarative make gcc binutils git openssh

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT

      - name: Build CLI
        run: |
          qmake6
          make
          strip note

      - name: Build GUI
        run: |
          qmake6 -o Makefile.gui clignotte-gui.pro
          make -f Makefile.gui
          strip note-gui

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            note
            note-gui

      - name: Update PKGBUILD and .SRCINFO versions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" pkg/archlinux/PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/"          pkg/archlinux/PKGBUILD
          sed -i "s/pkgver = .*/pkgver = ${VERSION}/" .SRCINFO
          sed -i "s/pkgrel = .*/pkgrel = 1/"          .SRCINFO

      - name: Publish to AUR
        if: ${{ env.AUR_SSH_KEY != '' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p ~/.ssh
          echo "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts

          git config --global user.email "fmeurou@odolix.fr"
          git config --global user.name "Frédéric Meurou"

          GIT_SSH_COMMAND="ssh -i ~/.ssh/aur" \
            git clone ssh://aur@aur.archlinux.org/clignotte.git /tmp/aur

          cp pkg/archlinux/PKGBUILD /tmp/aur/PKGBUILD
          cp .SRCINFO               /tmp/aur/.SRCINFO

          cd /tmp/aur
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet || \
            git commit -m "Update to v${VERSION}"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/aur" git push
