name: Release

on:
  push:
    branches: [master]
    paths: [VERSION]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    container: archlinux:latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm qt6-base qt6-declarative make gcc binutils git

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT

      - name: Build CLI
        run: |
          qmake6
          make
          strip note

      - name: Build GUI
        run: |
          qmake6 -o Makefile.gui clignotte-gui.pro
          make -f Makefile.gui
          strip note-gui

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            note
            note-gui
